name: test-workflow
on: [push]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Commit
        uses: actions/checkout
      - name: Java Setup
        uses: actions/setup-java@6
        with:
          distribution: temurin
          java-version: '17'
      - name: Java Version Verify
        run: java --version
      - name: Unit Test Execution
        run: ./gradlew test
